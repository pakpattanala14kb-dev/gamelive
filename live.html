<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Room - GameLive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #000; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    .video-container {
      flex: 1; position: relative;
      background: linear-gradient(135deg, #1a1a2e, #4a1c40);
      display: flex; justify-content: center; align-items: center;
    }
    .video-placeholder { font-size: 80px; opacity: 0.5; }
    
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 15px; display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      z-index: 10;
    }
    .streamer-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #7c3aed; display: flex; justify-content: center; align-items: center; font-size: 20px; }
    .streamer-name { font-weight: bold; font-size: 16px; }
    .live-tag { background: #ef4444; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; margin-left: 5px; }
    .viewers { font-size: 12px; color: #ddd; }
    .close-btn { background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 20px; cursor: pointer; color: white; text-decoration: none; font-weight: bold; }

    .chat-overlay {
      position: absolute; bottom: 70px; left: 15px;
      width: 75%; display: flex; flex-direction: column; gap: 8px;
      max-height: 250px; overflow-y: auto; pointer-events: none;
    }
    .chat-msg {
      background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 15px;
      font-size: 13px; width: fit-content; animation: slideUp 0.3s ease;
    }
    .chat-msg span { color: #a78bfa; font-weight: bold; margin-right: 5px; }
    .my-msg span { color: #fbbf24; } /* اپنے میسج کا رنگ */
    .gift-msg { background: linear-gradient(90deg, rgba(251,191,36,0.8), transparent); border-radius: 5px; padding: 5px 10px; font-size: 12px; font-weight: bold; color: black; }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 15px; display: flex; gap: 10px; align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10;
    }
    .chat-input {
      flex: 1; padding: 12px 15px; border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
      color: white; outline: none; font-size: 14px;
    }
    .chat-input::placeholder { color: #ccc; }
    
    /* سینڈ بٹن */
    .send-btn {
      background: #7c3aed; color: white; border: none; padding: 10px 15px;
      border-radius: 20px; font-weight: bold; cursor: pointer; display: none;
    }

    .icon-btn {
      width: 45px; height: 45px; border-radius: 50%; border: none;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; cursor: pointer; transition: 0.2s;
    }
    .icon-btn:active { transform: scale(0.9); }
    .gift-btn { background: #fbbf24; color: black; }
    .like-btn { background: #ec4899; color: white; }
  </style>
</head>
<body>

  <div class="video-container">
    <div class="video-placeholder">👤</div>

    <div class="top-bar">
      <div class="streamer-info">
        <div class="avatar">👤</div>
        <div>
          <div class="streamer-name">Ali Khan <span class="live-tag">LIVE</span></div>
          <div class="viewers">👥 2.3k viewers</div>
        </div>
      </div>
      <a href="index.html" class="close-btn">✖ بند کریں</a>
    </div>

    <!-- چیٹ باکس -->
    <div class="chat-overlay" id="chatBox">
      <div class="chat-msg"><span>Sara:</span> Hi Ali! 👋</div>
      <div class="chat-msg"><span>Ahmed:</span> کیا بات ہے بھائی!</div>
      <div class="gift-msg">🎁 Zara نے 100 کوائنز کے گفٹس بھیجے!</div>
      <div class="chat-msg"><span>Bilal:</span> Ludo کھیلیں گے؟</div>
    </div>

    <!-- نیچے کی بار -->
    <div class="bottom-bar">
      <input type="text" class="chat-input" id="chatInput" placeholder="میسج لکھیں..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">بھیجیں</button>
      <button class="icon-btn gift-btn" onclick="sendGift()">🎁</button>
      <button class="icon-btn like-btn" onclick="sendLike()">❤️</button>
    </div>
  </div>

  <!-- JavaScript (کام کرنے والا کوڈ) -->
  <script>
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatBox = document.getElementById('chatBox');

    // جب صارف لکھنا شروع کرے تو سینڈ بٹن دکھائیں
    chatInput.addEventListener('input', function() {
      if (this.value.trim() !== '') {
        sendBtn.style.display = 'block';
      } else {
        sendBtn.style.display = 'none';
      }
    });

    // میسج بھیجنے کا فنکشن
    function sendMessage() {
      const text = chatInput.value.trim();
      if (text !== '') {
        // نیا میسج بنائیں
        const newMsg = document.createElement('div');
        newMsg.className = 'chat-msg my-msg';
        newMsg.innerHTML = `<span>Aap:</span> ${text}`;
        
        // چیٹ باکس میں شامل کریں
        chatBox.appendChild(newMsg);
        
        // نیچے تک سکرول کریں
        chatBox.scrollTop = chatBox.scrollHeight;
        
        // انپٹ صاف کریں اور سینڈ بٹن چھپائیں
        chatInput.value = '';
        sendBtn.style.display = 'none';
      }
    }

    // انٹر (Enter) دبانے پر میسج بھیجیں
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // گفٹ بھیجنے کا فنکشن
    function sendGift() {
      const giftMsg = document.createElement('div');
      giftMsg.className = 'gift-msg';
      giftMsg.innerHTML = `🎁 Aap ne 100 کوائنز کا گفٹ بھیجا!`;
      chatBox.appendChild(giftMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // لائک (❤️) کرنے کا فنکشن
    function sendLike() {
      const likeMsg = document.createElement('div');
      likeMsg.className = 'chat-msg my-msg';
      likeMsg.innerHTML = `<span>Aap:</span> ❤️❤️❤️`;
      chatBox.appendChild(likeMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
